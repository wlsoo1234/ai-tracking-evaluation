<svg xmlns="http://www.w3.org/2000/svg" width="920" height="800" viewBox="0 0 920 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect width="920" height="800" fill="#fff"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold">Pretrained Gallery-ReID Person Search</text>
  <text x="460" y="56" text-anchor="middle" font-size="12" fill="#666">two reference views, one identity — no task-specific training</text>

  <rect x="35" y="95" width="260" height="70" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
  <text x="165" y="120" text-anchor="middle" font-size="13" fill="#7a3b00">reference snapshots 1 + 2</text>
  <text x="165" y="140" text-anchor="middle" font-size="11" fill="#9a5200">0°, 90°, 180°, 270° per image</text>
  <text x="165" y="156" text-anchor="middle" font-size="10" fill="#9a5200">kept independently, never averaged</text>

  <rect x="625" y="95" width="260" height="70" rx="8" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="755" y="122" text-anchor="middle" font-size="13" fill="#1c2b5e">input video</text>
  <text x="755" y="143" text-anchor="middle" font-size="11" fill="#4a5a8a">960×720 overhead RGB frames</text>

  <line x1="165" y1="165" x2="165" y2="215" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="755" y1="165" x2="755" y2="215" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="35" y="215" width="260" height="62" rx="8" fill="#eef7ee" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="165" y="240" text-anchor="middle" font-size="13" fill="#1c4a24">YOLO26n ReID encoder</text>
  <text x="165" y="260" text-anchor="middle" font-size="10.5" fill="#3a6a3a">L2-normalized identity gallery</text>

  <rect x="625" y="215" width="260" height="62" rx="8" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="755" y="240" text-anchor="middle" font-size="13" fill="#1c2b5e">YOLO26n + BoT-SORT</text>
  <text x="755" y="260" text-anchor="middle" font-size="10.5" fill="#4a5a8a">person boxes and persistent track IDs</text>

  <line x1="755" y1="277" x2="755" y2="330" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="625" y="330" width="260" height="62" rx="8" fill="#eef7ee" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="755" y="355" text-anchor="middle" font-size="13" fill="#1c4a24">dense bootstrap, then every 0.20s</text>
  <text x="755" y="375" text-anchor="middle" font-size="10.5" fill="#3a6a3a">batch selected active person crops</text>

  <line x1="295" y1="246" x2="450" y2="365" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="625" y1="361" x2="470" y2="361" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="330" width="260" height="68" rx="8" fill="#eef7ee" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="460" y="355" text-anchor="middle" font-size="13" fill="#1c4a24">max gallery cosine similarity</text>
  <text x="460" y="376" text-anchor="middle" font-size="10.5" fill="#3a6a3a">one score per sampled track observation</text>

  <line x1="460" y1="398" x2="460" y2="450" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="450" width="320" height="78" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5"/>
  <text x="460" y="475" text-anchor="middle" font-size="13" fill="#3a1c7a">track-level evidence</text>
  <text x="460" y="496" text-anchor="middle" font-size="10.5" fill="#5a3fa0">≥4 observations; mean top 10 ≥0.60</text>
  <text x="460" y="514" text-anchor="middle" font-size="10.5" fill="#5a3fa0">or strict reference-like peak ≥0.70</text>

  <line x1="460" y1="528" x2="460" y2="580" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="580" width="320" height="62" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5"/>
  <text x="460" y="605" text-anchor="middle" font-size="13" fill="#3a1c7a">emit every frame of accepted tracklets</text>
  <text x="460" y="625" text-anchor="middle" font-size="10.5" fill="#5a3fa0">at most one identity box per frame</text>

  <line x1="460" y1="642" x2="460" y2="690" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="260" y="690" width="180" height="54" rx="8" fill="#fff0f6" stroke="#c2255c" stroke-width="1.5"/>
  <text x="350" y="714" text-anchor="middle" font-size="13" fill="#7a1245">JSON</text>
  <text x="350" y="732" text-anchor="middle" font-size="10" fill="#a03060">diagnostics + segments + frames</text>
  <rect x="480" y="690" width="180" height="54" rx="8" fill="#fff0f6" stroke="#c2255c" stroke-width="1.5"/>
  <text x="570" y="714" text-anchor="middle" font-size="13" fill="#7a1245">CSV</text>
  <text x="570" y="732" text-anchor="middle" font-size="10" fill="#a03060">one row per matched frame</text>
</svg>
